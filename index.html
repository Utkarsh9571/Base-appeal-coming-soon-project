<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
  <title>Frontend Mentor | Base Apparel coming soon page</title>

 
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="logo">
        <img src="./images/logo.svg" alt="logo">
      </div>
      <img src="./images/hero-desktop.jpg" alt="hero-desktop" id="hero-desktop">
      <img src="./images/hero-mobile.jpg" alt="hero-mobile" id="hero-mobile">

      <div class="coming-soon">
        <h1>We're <span>coming soon</span></h1>
        <p>Hello fellow shoppers! We're currently building our new fashion store. 
           Add your email below to stay up-to-date with announcements and our launch deals.</p>

           <div class="submition">
            <form id="registration">
              <label>
                <input type="email" name="email" class="" placeholder="Email Address">
                <div class="error-hint hidden">Please provide a valid email</div>
                <div id="error-img"><img src="./images/icon-error.svg" alt="icon-error"></div>
              </label>
              
              <label for="submit">
                <button><img src="./images/icon-arrow.svg" alt="icon-arrow"></button>
              </label>
              
            </form>
          </div>
      </div>     
    </div>
  </div>    
    <script src="main.js"></script>
</body>
</html>
